name: Build & Release CSL Helpdesk Client

# Сборка и выкладка EXE выполняются АВТОМАТИЧЕСКИ при каждом пуше в ветку проекта,
# а также вручную (workflow_dispatch).
on:
  push:
    branches: ["arena/ff36115b-client-help"]
  workflow_dispatch:

# Нужно право создавать Releases (теги + выпуски).
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # ПРОВЕРКА КОДА: синтаксис + lint + тесты. Релиз выходит ЛИШЬ после
  # успешного завершения этого job (build имеет needs: check).
  # ------------------------------------------------------------------
  check:
    name: Code check (syntax, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (без sounddevice — не нужен для проверки)
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests psutil pillow pytest flake8

      - name: Syntax check (compile all)
        run: python -m compileall -q src tests

      - name: Lint (flake8)
        run: flake8 src tests

      - name: Unit tests
        run: python -m pytest tests/ -q

  build:
    needs: check
    runs-on: windows-latest
    steps:
      - name: Checkout (с историей — для генерации списка изменений)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Каждой УДАЧНОЙ сборке присваивается ПОРЯДКОВЫЙ номер = (число существующих
      # релизов) + 1. Подсчёт по релизам исключает дыры при неудачных сборках.
      - name: Compute next version number
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft==false)] | length' 2>/dev/null)
          COUNT=${COUNT:-0}
          NEXT=$((COUNT + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next build number: $NEXT (existing releases: $COUNT)"

      # Прописываем номер версии в сборку (читается приложением в заголовке/«О программе»).
      - name: Write version file
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.number }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $repo = "${{ github.repository }}"
          $content = @"
          # AUTOGENERATED by CI. Do not edit manually.
          APP_VERSION = "$version"
          BUILD_DATE = "$date"
          GITHUB_REPO = "$repo"
          "@
          Set-Content -Path src/_version.py -Value $content -Encoding utf8

      - name: Build EXE (PyInstaller, one-file, windowed, icon)
        run: >
          pyinstaller --onefile --windowed --name CSLHelpdesk
          --icon assets/icon.png --add-data "assets/icon.png;assets"
          --hidden-import=system_info --hidden-import=jira_client
          --hidden-import=screenshot --hidden-import=audio_recorder
          --hidden-import=config --hidden-import=updater --hidden-import=_version
          src/helpdesk_client.py

      # Список изменений берём из git-лога с момента предыдущего тега.
      - name: Generate release notes
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --oneline -20)
          else
            LOG=$(git log "${LAST_TAG}..HEAD" --oneline)
          fi
          {
            echo "## Изменения в сборке"
            echo ""
            echo "$LOG" | sed 's/^/- /'
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            --title "CSL Helpdesk v${{ steps.version.outputs.number }}" `
            --notes-file notes.md `
            dist/CSLHelpdesk.exe

      - name: Upload artifact (дублирующее копирование из Actions)
        uses: actions/upload-artifact@v4
        with:
          name: CSLHelpdesk-v${{ steps.version.outputs.number }}
          path: dist/CSLHelpdesk.exe
