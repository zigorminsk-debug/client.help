name: Build & Release CSL Helpdesk Client

# Сборка и выкладка EXE + MSI выполняются АВТОМАТИЧЕСКИ при каждом пуше в ветку проекта,
# а также вручную (workflow_dispatch).
on:
  push:
    branches: ["arena/9ba65963-client-help"]
  workflow_dispatch:

# Нужно право создавать Releases (теги + выпуски).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (с историей — для генерации списка изменений)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Каждой УДАЧНОЙ сборке присваивается ПОРЯДКОВЫЙ номер = (число релизов) + 1.
      - name: Compute next version number
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft==false)] | length' 2>/dev/null)
          COUNT=${COUNT:-0}
          NEXT=$((COUNT + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next build number: $NEXT (existing releases: $COUNT)"

      # Прописываем номер версии в сборку (читается приложением).
      - name: Write version file
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.number }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $repo = "${{ github.repository }}"
          $content = @"
          # AUTOGENERATED by CI. Do not edit manually.
          APP_VERSION = "$version"
          BUILD_DATE = "$date"
          GITHUB_REPO = "$repo"
          "@
          Set-Content -Path src/_version.py -Value $content -Encoding utf8

      - name: Build EXE (PyInstaller, one-file, windowed)
        run: >
          pyinstaller --onefile --windowed --name CSLHelpdesk
          --hidden-import=system_info --hidden-import=jira_client
          --hidden-import=screenshot --hidden-import=audio_recorder
          --hidden-import=config --hidden-import=updater --hidden-import=_version
          src/helpdesk_client.py

      # MSI использует конфиг по умолчанию из шаблона (github_repo уже корректен);
      # реальные учётные данные Jira админ задаёт через GPO/реестр (перекрывают этот).
      - name: Prepare MSI config (default from template; admin overrides via GPO)
        shell: bash
        run: cp deploy/admin-config.json.template deploy/config.json

      - name: Install WiX (dotnet tool, v4)
        run: dotnet tool install --global wix

      - name: Build MSI (per-user, WiX v4)
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix build wix/HelpdeskClient.wxs -dMsiVersion="1.0.${{ steps.version.outputs.number }}" -o dist/CSLHelpdesk.msi

      - name: Generate release notes
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --oneline -20)
          else
            LOG=$(git log "${LAST_TAG}..HEAD" --oneline)
          fi
          { echo "## Изменения в сборке"; echo ""; echo "$LOG" | sed 's/^/- /'; } > notes.md
          cat notes.md

      - name: Create GitHub Release (EXE + MSI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            --title "CSL Helpdesk v${{ steps.version.outputs.number }}" `
            --notes-file notes.md `
            dist/CSLHelpdesk.exe dist/CSLHelpdesk.msi

      - name: Upload artifact (EXE + MSI)
        uses: actions/upload-artifact@v4
        with:
          name: CSLHelpdesk-v${{ steps.version.outputs.number }}
          path: |
            dist/CSLHelpdesk.exe
            dist/CSLHelpdesk.msi
